[selfplay]
selfplay_rows_per_shard = 32768
selfplay_write_queue = 128
bootstrap_evaluator = random
selfplay_schedule = adaptive
games_per_iter = 200
bootstrap_games = 200
backfill_factor = 1.1

[opening]
balanced_opening_prob = 0.99
balanced_opening_max_tries = 20
balanced_opening_avg_dist_factor = 0.8
balanced_opening_balance_exponent = 4.0
balanced_opening_rejection_prob = 0.995
balanced_opening_rejection_prob_fallback = 0.8
balanced_opening_run_policy_init_after = true
balanced_opening_run_policy_init_on_failure = true
init_games_with_policy = true
policy_init_avg_move_num = 6.0
policy_init_temperature = 1.6

[search]
full_search_visits = 400
cheap_search_visits = 80
cheap_search_prob = 0.75
pb_c_init = 1.25
pb_c_base = 19652

[noise]
dirichlet_total_concentration = 6.75
dirichlet_noise_weight = 0.25
shaped_dirichlet_noise = true

[fpu]
use_fpu = true
fpu_reduction_max = 0.2
root_fpu_reduction_max = 0.0
fpu_parent_weight_by_visited_policy_pow = 2.0

[lcb]
use_lcb_for_selection = true
lcb_stdevs = 5.0
min_visit_prop_for_lcb = 0.15

[temperature]
move_temperature_schedule = exponential
temperature_moves = 30
chosen_move_temperature_early = 0.75
chosen_move_temperature = 0.15
chosen_move_temperature_halflife = 19.0
root_policy_temperature_early = 1.3
root_policy_temperature = 1.1
