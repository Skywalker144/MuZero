[eval]
seed = 1

[arena]
board_size = 15
rule = renju
num_game_threads = 40

[search]
root_desired_per_child_visits_coeff = 0.0
use_policy_target_pruning = true
full_search_visits = 200
num_search_threads = 1
virtual_loss = 1.0
pb_c_init = 1.25
pb_c_base = 19652

[fpu]
use_fpu = true
fpu_reduction_max = 0.2
root_fpu_reduction_max = 0.1
fpu_parent_weight_by_visited_policy_pow = 2.0

[lcb]
use_lcb_for_selection = true
lcb_stdevs = 5.0
min_visit_prop_for_lcb = 0.15

[temperature]
nn_policy_temperature = 1.1
chosen_move_temperature = 0.0
root_policy_temperature = 1.0

[inference]
device = cuda:0
torch_threads = 1
nn_max_batch_size = 64
nn_batch_wait_us = 1000

[opening]
balanced_opening_prob = 1.0
balanced_opening_max_tries = 20
balanced_opening_avg_dist_factor = 0.8
balanced_opening_balance_exponent = 10.0
balanced_opening_rejection_prob = 0.995
balanced_opening_rejection_prob_fallback = 0.8
balanced_opening_run_policy_init_after = true
balanced_opening_run_policy_init_on_failure = false
init_games_with_policy = true
policy_init_avg_move_num = 6.0
policy_init_temperature = 1.6
