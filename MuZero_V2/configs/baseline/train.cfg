[parallel]
torch_threads = 1
num_game_threads = 64
nn_max_batch_size = 32
nn_batch_wait_us = 100

[training]
batch_prefetch = 2
ema_halflife_samples = 128000
batch_size = 128
train_steps = 1000
unroll_steps = 5
hidden_gradient_scale = 0.5
symmetry_augmentation = true

[optimizer]
lr = 0.001
weight_decay = 0.0003
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 0.00000001

[loss]
value_loss_scale = 1.2
soft_policy_loss_scale = 0.5
opponent_policy_loss_scale = 0.15
soft_policy_temperature = 4.0
soft_policy_eps = 0.0000001

[replay]
replay_ratio = 8.0
replay_window = power_law
fixed_window_rows = 1000000
min_rows = 250000
max_rows = 0
taper_window_exponent = 0.675
expand_window_per_row = 0.4
